[project]
name = "adversarial-dojo"
version = "0.1.0"
description = "Benchmark agents against evolved indirect prompt injection attacks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentshim>=0.5.0",
    "grpcio-tools>=1.80.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.23.0",
    "mcp[cli]>=1.27.0",
    "protobuf>=6.33.6",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
adversarial-dojo = "adversarial_dojo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
