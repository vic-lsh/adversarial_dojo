# Minimal experiment config using a small proto-backed tool interface.

id = "minimal-workspace"
tool_interface_file = "tool_interfaces/minimal_workspace.yaml"

[agents.user_task]
provider = "codex"
model = "gpt-5.5"
reasoning_effort = "medium"

[agents.red_team]
provider = "codex"
model = "gpt-5.5"
reasoning_effort = "medium"

[agents.victim]
provider = "claude"
model = "haiku"

[agents.analyzer]
provider = "claude"
model = "haiku"

[benchmark]
max_attempts = 3
victim_profile = "A workspace assistant with document and email tools."

[benchmark.constraints]
max_tool_result_chars = 4000
max_tool_impl_chars = 8000
tool_timeout_seconds = 2.0
