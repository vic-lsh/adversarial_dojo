syntax = "proto3";

package adversarial_dojo.google_workspace_mcp;

import "google/protobuf/struct.proto";

service Gmail {
  rpc SearchGmailMessages(SearchGmailMessagesRequest) returns (ToolTextResponse);
  rpc GetGmailMessageContent(GetGmailMessageContentRequest) returns (ToolTextResponse);
  rpc GetGmailMessagesContentBatch(GetGmailMessagesContentBatchRequest) returns (ToolTextResponse);
  rpc GetGmailAttachmentContent(GetGmailAttachmentContentRequest) returns (ToolTextResponse);
  rpc SendGmailMessage(SendGmailMessageRequest) returns (ToolTextResponse);
  rpc DraftGmailMessage(DraftGmailMessageRequest) returns (ToolTextResponse);
  rpc GetGmailThreadContent(GetGmailThreadContentRequest) returns (ToolTextResponse);
  rpc GetGmailThreadsContentBatch(GetGmailThreadsContentBatchRequest) returns (ToolTextResponse);
  rpc ListGmailLabels(ListGmailLabelsRequest) returns (ToolTextResponse);
  rpc ManageGmailLabel(ManageGmailLabelRequest) returns (ToolTextResponse);
  rpc ListGmailFilters(ListGmailFiltersRequest) returns (ToolTextResponse);
  rpc ManageGmailFilter(ManageGmailFilterRequest) returns (ToolTextResponse);
  rpc ModifyGmailMessageLabels(ModifyGmailMessageLabelsRequest) returns (ToolTextResponse);
  rpc BatchModifyGmailMessageLabels(BatchModifyGmailMessageLabelsRequest) returns (ToolTextResponse);
}

service Drive {
  rpc SearchDriveFiles(SearchDriveFilesRequest) returns (ToolTextResponse);
  rpc GetDriveFileContent(GetDriveFileContentRequest) returns (ToolTextResponse);
  rpc GetDriveFileDownloadUrl(GetDriveFileDownloadUrlRequest) returns (ToolTextResponse);
  rpc ListDriveItems(ListDriveItemsRequest) returns (ToolTextResponse);
  rpc CreateDriveFolder(CreateDriveFolderRequest) returns (ToolTextResponse);
  rpc CreateDriveFile(CreateDriveFileRequest) returns (ToolTextResponse);
  rpc ImportToGoogleDoc(ImportToGoogleDocRequest) returns (ToolTextResponse);
  rpc GetDriveFilePermissions(GetDriveFilePermissionsRequest) returns (ToolTextResponse);
  rpc CheckDriveFilePublicAccess(CheckDriveFilePublicAccessRequest) returns (ToolTextResponse);
  rpc UpdateDriveFile(UpdateDriveFileRequest) returns (ToolTextResponse);
  rpc GetDriveShareableLink(GetDriveShareableLinkRequest) returns (ToolTextResponse);
  rpc ManageDriveAccess(ManageDriveAccessRequest) returns (ToolTextResponse);
  rpc CopyDriveFile(CopyDriveFileRequest) returns (ToolTextResponse);
  rpc SetDriveFilePermissions(SetDriveFilePermissionsRequest) returns (ToolTextResponse);
}

service Calendar {
  rpc ListCalendars(ListCalendarsRequest) returns (ToolTextResponse);
  rpc GetEvents(GetEventsRequest) returns (ToolTextResponse);
  rpc ManageEvent(ManageEventRequest) returns (ToolTextResponse);
  rpc ManageOutOfOffice(ManageOutOfOfficeRequest) returns (ToolTextResponse);
  rpc ManageFocusTime(ManageFocusTimeRequest) returns (ToolTextResponse);
  rpc QueryFreebusy(QueryFreebusyRequest) returns (ToolTextResponse);
  rpc CreateCalendar(CreateCalendarRequest) returns (ToolTextResponse);
}

service Docs {
  rpc SearchDocs(SearchDocsRequest) returns (ToolTextResponse);
  rpc GetDocContent(GetDocContentRequest) returns (ToolTextResponse);
  rpc ListDocsInFolder(ListDocsInFolderRequest) returns (ToolTextResponse);
  rpc CreateDoc(CreateDocRequest) returns (ToolTextResponse);
  rpc ModifyDocText(ModifyDocTextRequest) returns (ToolTextResponse);
  rpc FindAndReplaceDoc(FindAndReplaceDocRequest) returns (ToolTextResponse);
  rpc InsertDocElements(InsertDocElementsRequest) returns (ToolTextResponse);
  rpc InsertDocImage(InsertDocImageRequest) returns (ToolTextResponse);
  rpc UpdateDocHeadersFooters(UpdateDocHeadersFootersRequest) returns (ToolTextResponse);
  rpc BatchUpdateDoc(BatchUpdateDocRequest) returns (ToolTextResponse);
  rpc InspectDocStructure(InspectDocStructureRequest) returns (ToolTextResponse);
  rpc DebugDocsRuntimeInfo(DebugDocsRuntimeInfoRequest) returns (ToolTextResponse);
  rpc CreateTableWithData(CreateTableWithDataRequest) returns (ToolTextResponse);
  rpc DebugTableStructure(DebugTableStructureRequest) returns (ToolTextResponse);
  rpc ExportDocToPdf(ExportDocToPdfRequest) returns (ToolTextResponse);
  rpc UpdateParagraphStyle(UpdateParagraphStyleRequest) returns (ToolTextResponse);
  rpc GetDocAsMarkdown(GetDocAsMarkdownRequest) returns (ToolTextResponse);
  rpc ManageDocTab(ManageDocTabRequest) returns (ToolTextResponse);
  rpc ListDocumentComments(ListDocumentCommentsRequest) returns (ToolTextResponse);
  rpc ManageDocumentComment(ManageDocumentCommentRequest) returns (ToolTextResponse);
}

service Sheets {
  rpc ListSpreadsheets(ListSpreadsheetsRequest) returns (ToolTextResponse);
  rpc GetSpreadsheetInfo(GetSpreadsheetInfoRequest) returns (ToolTextResponse);
  rpc ReadSheetValues(ReadSheetValuesRequest) returns (ToolTextResponse);
  rpc ModifySheetValues(ModifySheetValuesRequest) returns (ToolTextResponse);
  rpc FormatSheetRange(FormatSheetRangeRequest) returns (ToolTextResponse);
  rpc ManageConditionalFormatting(ManageConditionalFormattingRequest) returns (ToolTextResponse);
  rpc CreateSpreadsheet(CreateSpreadsheetRequest) returns (ToolTextResponse);
  rpc CreateSheet(CreateSheetRequest) returns (ToolTextResponse);
  rpc ListSheetTables(ListSheetTablesRequest) returns (ToolTextResponse);
  rpc AppendTableRows(AppendTableRowsRequest) returns (ToolTextResponse);
  rpc ResizeSheetDimensions(ResizeSheetDimensionsRequest) returns (ToolTextResponse);
  rpc MoveSheetRows(MoveSheetRowsRequest) returns (ToolTextResponse);
  rpc ListSpreadsheetComments(ListSpreadsheetCommentsRequest) returns (ToolTextResponse);
  rpc ManageSpreadsheetComment(ManageSpreadsheetCommentRequest) returns (ToolTextResponse);
}

service Slides {
  rpc CreatePresentation(CreatePresentationRequest) returns (ToolTextResponse);
  rpc GetPresentation(GetPresentationRequest) returns (ToolTextResponse);
  rpc BatchUpdatePresentation(BatchUpdatePresentationRequest) returns (ToolTextResponse);
  rpc GetPage(GetPageRequest) returns (ToolTextResponse);
  rpc GetPageThumbnail(GetPageThumbnailRequest) returns (ToolTextResponse);
  rpc ListPresentationComments(ListPresentationCommentsRequest) returns (ToolTextResponse);
  rpc ManagePresentationComment(ManagePresentationCommentRequest) returns (ToolTextResponse);
}

service Forms {
  rpc CreateForm(CreateFormRequest) returns (ToolTextResponse);
  rpc GetForm(GetFormRequest) returns (ToolTextResponse);
  rpc SetPublishSettings(SetPublishSettingsRequest) returns (ToolTextResponse);
  rpc GetFormResponse(GetFormResponseRequest) returns (ToolTextResponse);
  rpc ListFormResponses(ListFormResponsesRequest) returns (ToolTextResponse);
  rpc BatchUpdateForm(BatchUpdateFormRequest) returns (ToolTextResponse);
}

service Tasks {
  rpc ListTaskLists(ListTaskListsRequest) returns (ToolTextResponse);
  rpc GetTaskList(GetTaskListRequest) returns (ToolTextResponse);
  rpc ManageTaskList(ManageTaskListRequest) returns (ToolTextResponse);
  rpc ListTasks(ListTasksRequest) returns (ToolTextResponse);
  rpc GetTask(GetTaskRequest) returns (ToolTextResponse);
  rpc ManageTask(ManageTaskRequest) returns (ToolTextResponse);
}

service Contacts {
  rpc ListContacts(ListContactsRequest) returns (ToolTextResponse);
  rpc GetContact(GetContactRequest) returns (ToolTextResponse);
  rpc SearchContacts(SearchContactsRequest) returns (ToolTextResponse);
  rpc ManageContact(ManageContactRequest) returns (ToolTextResponse);
  rpc ListContactGroups(ListContactGroupsRequest) returns (ToolTextResponse);
  rpc GetContactGroup(GetContactGroupRequest) returns (ToolTextResponse);
  rpc ManageContactsBatch(ManageContactsBatchRequest) returns (ToolTextResponse);
  rpc ManageContactGroup(ManageContactGroupRequest) returns (ToolTextResponse);
}

service Chat {
  rpc ListSpaces(ListSpacesRequest) returns (ToolTextResponse);
  rpc GetMessages(GetMessagesRequest) returns (ToolTextResponse);
  rpc SendMessage(SendMessageRequest) returns (ToolTextResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (ToolTextResponse);
  rpc CreateReaction(CreateReactionRequest) returns (ToolTextResponse);
  rpc DownloadChatAttachment(DownloadChatAttachmentRequest) returns (ToolTextResponse);
}

service Search {
  rpc SearchCustom(SearchCustomRequest) returns (ToolTextResponse);
  rpc GetSearchEngineInfo(GetSearchEngineInfoRequest) returns (ToolTextResponse);
}

service AppsScript {
  rpc ListScriptProjects(ListScriptProjectsRequest) returns (ToolTextResponse);
  rpc GetScriptProject(GetScriptProjectRequest) returns (ToolTextResponse);
  rpc GetScriptContent(GetScriptContentRequest) returns (ToolTextResponse);
  rpc CreateScriptProject(CreateScriptProjectRequest) returns (ToolTextResponse);
  rpc UpdateScriptContent(UpdateScriptContentRequest) returns (ToolTextResponse);
  rpc RunScriptFunction(RunScriptFunctionRequest) returns (ToolTextResponse);
  rpc ListDeployments(ListDeploymentsRequest) returns (ToolTextResponse);
  rpc ManageDeployment(ManageDeploymentRequest) returns (ToolTextResponse);
  rpc ListScriptProcesses(ListScriptProcessesRequest) returns (ToolTextResponse);
}
message ToolTextResponse {
  string result = 1;
}

message SearchGmailMessagesRequest {
  string query = 1;
  optional int32 page_size = 2;
  optional string page_token = 3;
}

message GetGmailMessageContentRequest {
  string message_id = 1;
  optional string body_format = 2;
}

message GetGmailMessagesContentBatchRequest {
  repeated string message_ids = 1;
  optional string format = 2;
  optional string body_format = 3;
}

message GetGmailAttachmentContentRequest {
  string message_id = 1;
  string attachment_id = 2;
  optional bool return_base64 = 3;
}

message SendGmailMessageRequest {
  string to = 1;
  string subject = 2;
  string body = 3;
  optional string body_format = 4;
  optional string cc = 5;
  optional string bcc = 6;
  optional string from_name = 7;
  optional string from_email = 8;
  optional string thread_id = 9;
  optional string in_reply_to = 10;
  optional string references = 11;
  repeated google.protobuf.Struct attachments = 12;
  optional bool include_signature = 13;
}

message DraftGmailMessageRequest {
  string subject = 1;
  string body = 2;
  optional string body_format = 3;
  optional string to = 4;
  optional string cc = 5;
  optional string bcc = 6;
  optional string from_name = 7;
  optional string from_email = 8;
  optional string thread_id = 9;
  optional string in_reply_to = 10;
  optional string references = 11;
  repeated google.protobuf.Struct attachments = 12;
  optional bool include_signature = 13;
  optional bool quote_original = 14;
}

message GetGmailThreadContentRequest {
  string thread_id = 1;
  optional string body_format = 2;
  optional bool include_analysis = 3;
}

message GetGmailThreadsContentBatchRequest {
  repeated string thread_ids = 1;
  optional string body_format = 2;
}

message ListGmailLabelsRequest {
}

message ManageGmailLabelRequest {
  string action = 1;
  optional string name = 2;
  optional string label_id = 3;
  optional string label_list_visibility = 4;
  optional string message_list_visibility = 5;
}

message ListGmailFiltersRequest {
}

message ManageGmailFilterRequest {
  string action = 1;
  optional google.protobuf.Struct criteria = 2;
  optional google.protobuf.Struct filter_action = 3;
  optional string filter_id = 4;
}

message ModifyGmailMessageLabelsRequest {
  string message_id = 1;
  repeated string add_label_ids = 2;
  repeated string remove_label_ids = 3;
}

message BatchModifyGmailMessageLabelsRequest {
  repeated string message_ids = 1;
  repeated string add_label_ids = 2;
  repeated string remove_label_ids = 3;
}

