message ManageTaskListRequest {
  string action = 1;
  optional string task_list_id = 2;
  optional string title = 3;
}

message ListTasksRequest {
  string task_list_id = 1;
  optional int32 max_results = 2;
  optional string page_token = 3;
  optional bool show_completed = 4;
  optional bool show_deleted = 5;
  optional bool show_hidden = 6;
  optional bool show_assigned = 7;
  optional string completed_max = 8;
  optional string completed_min = 9;
  optional string due_max = 10;
  optional string due_min = 11;
  optional string updated_min = 12;
}

message GetTaskRequest {
  string task_list_id = 1;
  string task_id = 2;
}

message ManageTaskRequest {
  string action = 1;
  string task_list_id = 2;
  optional string task_id = 3;
  optional string title = 4;
  optional string notes = 5;
  optional string status = 6;
  optional string due = 7;
  optional string parent = 8;
  optional string previous = 9;
  optional string destination_task_list = 10;
}

message SearchCustomRequest {
  string q = 1;
  optional int32 num = 2;
  optional int32 start = 3;
  optional string safe = 4;
  optional string search_type = 5;
  optional string site_search = 6;
  optional string site_search_filter = 7;
  optional string date_restrict = 8;
  optional string file_type = 9;
  optional string language = 10;
  optional string country = 11;
  repeated string sites = 12;
}

message GetSearchEngineInfoRequest {
}

message ListContactsRequest {
  optional int32 page_size = 1;
  optional string page_token = 2;
  optional string sort_order = 3;
}

message GetContactRequest {
  string contact_id = 1;
}

message SearchContactsRequest {
  string query = 1;
  optional int32 page_size = 2;
}

message ManageContactRequest {
  string action = 1;
  optional string contact_id = 2;
  optional string given_name = 3;
  optional string family_name = 4;
  repeated google.protobuf.Struct phones = 5;
  repeated google.protobuf.Struct emails = 6;
  repeated google.protobuf.Struct organizations = 7;
  optional string notes = 8;
  optional string address = 9;
  optional string phones_mode = 10;
  optional string emails_mode = 11;
  optional string organizations_mode = 12;
  optional string phone = 13;
  optional string email = 14;
  optional string organization = 15;
  optional string job_title = 16;
}

message ListContactGroupsRequest {
  optional int32 page_size = 1;
  optional string page_token = 2;
}

message GetContactGroupRequest {
  string group_id = 1;
  optional int32 max_members = 2;
}

message ManageContactsBatchRequest {
  string action = 1;
  repeated google.protobuf.Struct contacts = 2;
  repeated google.protobuf.Struct updates = 3;
  repeated string contact_ids = 4;
  optional string field = 5;
}

message ManageContactGroupRequest {
  string action = 1;
  optional string group_id = 2;
  optional string name = 3;
  optional bool delete_contacts = 4;
  repeated string add_contact_ids = 5;
  repeated string remove_contact_ids = 6;
}

message ListScriptProjectsRequest {
  optional int32 page_size = 1;
  optional string page_token = 2;
}

message GetScriptProjectRequest {
  string script_id = 1;
}

message GetScriptContentRequest {
  string script_id = 1;
  string file_name = 2;
}

message CreateScriptProjectRequest {
  string title = 1;
  optional string parent_id = 2;
}

message UpdateScriptContentRequest {
  string script_id = 1;
  repeated google.protobuf.Struct files = 2;
}

message RunScriptFunctionRequest {
  string script_id = 1;
  string function_name = 2;
  repeated google.protobuf.Value parameters = 3;
  optional bool dev_mode = 4;
}

message ListDeploymentsRequest {
  string script_id = 1;
}

message ManageDeploymentRequest {
  string action = 1;
  string script_id = 2;
  optional string deployment_id = 3;
  optional string description = 4;
  optional string version_description = 5;
}

message ListScriptProcessesRequest {
  optional int32 page_size = 1;
  optional string script_id = 2;
}
