# Fixed tool surface generated from taylorwilsdon/google_workspace_mcp via `fastmcp inspect --format mcp`.
# Source repo inspected: https://github.com/taylorwilsdon/google_workspace_mcp

[[mcp_servers]]
name = "google_workspace"

[[mcp_servers.tools]]
name = "search_gmail_messages"
description = '''Searches messages in a user's Gmail account based on a query.
Returns both Message IDs and Thread IDs for each found message, along with Gmail web interface links for manual verification.
Supports pagination via page_token parameter.'''
args_schema = { additionalProperties = false, properties = { query = { type = "string", description = "The search query. Supports standard Gmail search operators." }, page_size = { default = 10, type = "integer", description = "The maximum number of messages to return. Defaults to 10." }, page_token = { anyOf = [{ type = "string" }, { type = "null" }], description = "Token for retrieving the next page of results. Use the next_page_token from a previous response." } }, required = ["query"], type = "object" }

[[mcp_servers.tools]]
name = "get_gmail_message_content"
description = '''Retrieves the full content (subject, sender, recipients, body) of a specific Gmail message.'''
args_schema = { additionalProperties = false, properties = { message_id = { type = "string", description = "The unique ID of the Gmail message to retrieve." }, body_format = { default = "text", description = "Body output format. 'text' (default) returns plaintext (HTML converted to text as fallback). 'html' returns the raw HTML body as-is without conversion. 'raw' fetches the full raw MIME message and returns the base64url-decoded content.", enum = ["text", "html", "raw"], type = "string" } }, required = ["message_id"], type = "object" }

[[mcp_servers.tools]]
name = "get_gmail_messages_content_batch"
description = '''Retrieves the content of multiple Gmail messages in a single batch request.
Supports up to 25 messages per batch to prevent SSL connection exhaustion.'''
args_schema = { additionalProperties = false, properties = { message_ids = { items = { type = "string" }, type = "array", description = "List of Gmail message IDs to retrieve (max 25 per batch)." }, format = { default = "full", enum = ["full", "metadata"], type = "string", description = "Message format. \"full\" includes body, \"metadata\" only headers." }, body_format = { default = "text", description = "Body output format (only applies when format='full'). 'text' (default) returns plaintext (HTML converted to text as fallback). 'html' returns the raw HTML body as-is without conversion. 'raw' fetches the full raw MIME message and returns the base64url-decoded content.", enum = ["text", "html", "raw"], type = "string" } }, required = ["message_ids"], type = "object" }

[[mcp_servers.tools]]
name = "get_gmail_attachment_content"
description = '''Downloads an email attachment and saves it to local disk.

In stdio mode, returns the local file path for direct access.
In HTTP mode, returns a temporary download URL (valid for 1 hour).
May re-fetch message metadata to resolve filename and MIME type.'''
args_schema = { additionalProperties = false, properties = { message_id = { type = "string", description = "The ID of the Gmail message containing the attachment." }, attachment_id = { type = "string", description = "The ID of the attachment to download." }, return_base64 = { default = false, type = "boolean", description = "When True, includes the full attachment as a\nstandard base64 string in the response (in addition to any file\npath or download URL). Useful for sandboxed clients that cannot\nreach localhost download URLs or the MCP server's local file\npaths (e.g. containerized agents with network allowlists). The\nreturned base64 uses the standard alphabet, so it can be passed\ndirectly to tools like ``draft_gmail_message`` that expect\nstandard (not URL-safe) base64. Default False preserves the\nexisting behavior and response size." } }, required = ["message_id", "attachment_id"], type = "object" }

[[mcp_servers.tools]]
name = "send_gmail_message"
description = '''Sends an email using the user's Gmail account. Supports both new emails and replies with optional attachments.
Supports Gmail's "Send As" feature to send from configured alias addresses.'''
args_schema = { additionalProperties = false, properties = { to = { description = "Recipient email address.", type = "string" }, subject = { description = "Email subject.", type = "string" }, body = { description = "Email body content (plain text or HTML).", type = "string" }, body_format = { default = "plain", description = "Email body format. Use 'plain' for plaintext or 'html' for HTML content.", enum = ["plain", "html"], type = "string" }, cc = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional CC email address." }, bcc = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional BCC email address." }, from_name = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional sender display name (e.g., 'Peter Hartree'). If provided, the From header will be formatted as 'Name <email>'." }, from_email = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional 'Send As' alias email address. Must be configured in Gmail settings (Settings > Accounts > Send mail as). If not provided, uses the authenticated user's email." }, thread_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional Gmail thread ID to reply within." }, in_reply_to = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional RFC Message-ID of the message being replied to (e.g., '<message123@gmail.com>')." }, references = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional chain of Message-IDs for proper threading." }, attachments = { anyOf = [{ items = { additionalProperties = true, type = "object" }, type = "array" }, { type = "null" }], description = "Optional list of attachments. Each can have: \"url\" (fetch from URL — works with MCP attachment URLs from get_drive_file_download_url / get_gmail_attachment_content), OR \"path\" (file path, auto-encodes), OR \"content\" (standard base64, not urlsafe) + \"filename\". Optional \"mime_type\". Example: [{\"url\": \"https://host/attachments/abc-123\", \"filename\": \"report.pdf\"}]" }, include_signature = { default = true, description = "Whether to append the Gmail signature from Settings > Signature when available. Defaults to true.", type = "boolean" } }, required = ["to", "subject", "body"], type = "object" }

[[mcp_servers.tools]]
name = "draft_gmail_message"
description = '''Creates a draft email in the user's Gmail account. Supports both new drafts and reply drafts with optional attachments.
Supports Gmail's "Send As" feature to draft from configured alias addresses.'''
args_schema = { additionalProperties = false, properties = { subject = { description = "Email subject.", type = "string" }, body = { description = "Email body (plain text).", type = "string" }, body_format = { default = "plain", description = "Email body format. Use 'plain' for plaintext or 'html' for HTML content.", enum = ["plain", "html"], type = "string" }, to = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional recipient email address." }, cc = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional CC email address." }, bcc = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional BCC email address." }, from_name = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional sender display name (e.g., 'Peter Hartree'). If provided, the From header will be formatted as 'Name <email>'." }, from_email = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional 'Send As' alias email address. Must be configured in Gmail settings (Settings > Accounts > Send mail as). If not provided, uses the authenticated user's email." }, thread_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional Gmail thread ID to reply within." }, in_reply_to = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional RFC Message-ID of the message being replied to (e.g., '<message123@gmail.com>')." }, references = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional chain of Message-IDs for proper threading." }, attachments = { anyOf = [{ items = { additionalProperties = true, type = "object" }, type = "array" }, { type = "null" }], description = "Optional list of attachments. Each can have: 'url' (fetch from URL — works with MCP attachment URLs from get_drive_file_download_url / get_gmail_attachment_content), OR 'path' (file path, auto-encodes), OR 'content' (standard base64, not urlsafe) + 'filename'. Optional 'mime_type' (auto-detected if not provided)." }, include_signature = { default = true, description = "Whether to append the Gmail signature from Settings > Signature when available. Defaults to true.", type = "boolean" }, quote_original = { default = false, description = "Whether to include the original message as a quoted reply. Requires thread_id. Defaults to false.", type = "boolean" } }, required = ["subject", "body"], type = "object" }

[[mcp_servers.tools]]
name = "get_gmail_thread_content"
description = '''Retrieves the complete content of a Gmail conversation thread, including all messages.

Optionally also returns structured ownership analysis so a caller can
determine who sent the last message and who owes whom a response without
re-parsing the formatted string or making a second tool call.'''
args_schema = { additionalProperties = false, properties = { thread_id = { type = "string", description = "The unique ID of the Gmail thread to retrieve." }, body_format = { default = "text", description = "Body output format. 'text' (default) returns plaintext (HTML converted to text as fallback). 'html' returns the raw HTML body as-is without conversion. 'raw' fetches each message's full raw MIME content and returns the base64url-decoded body.", enum = ["text", "html", "raw"], type = "string" }, include_analysis = { default = false, description = "When True, the return value is a dict with both the formatted thread content AND structured ownership analysis (last sender, ball-in-court verdict, per-sender message counts, participants). Defaults to False, in which case the existing string return shape is preserved.", type = "boolean" } }, required = ["thread_id"], type = "object" }

[[mcp_servers.tools]]
name = "get_gmail_threads_content_batch"
description = '''Retrieves the content of multiple Gmail threads in a single batch request.
Supports up to 25 threads per batch to prevent SSL connection exhaustion.'''
args_schema = { additionalProperties = false, properties = { thread_ids = { items = { type = "string" }, type = "array", description = "A list of Gmail thread IDs to retrieve. The function will automatically batch requests in chunks of 25." }, body_format = { default = "text", description = "Body output format. 'text' (default) returns plaintext (HTML converted to text as fallback). 'html' returns the raw HTML body as-is without conversion. 'raw' fetches each message's full raw MIME content and returns the base64url-decoded body.", enum = ["text", "html", "raw"], type = "string" } }, required = ["thread_ids"], type = "object" }

[[mcp_servers.tools]]
name = "list_gmail_labels"
description = '''Lists all labels in the user's Gmail account.

Args:
Returns:
    str: A formatted list of all labels with their IDs, names, and types.'''
args_schema = { additionalProperties = false, properties = {  }, type = "object" }

[[mcp_servers.tools]]
name = "manage_gmail_label"
description = '''Manages Gmail labels: create, update, or delete labels.'''
args_schema = { additionalProperties = false, properties = { action = { enum = ["create", "update", "delete"], type = "string", description = "Action to perform on the label." }, name = { anyOf = [{ type = "string" }, { type = "null" }], description = "Label name. Required for create, optional for update." }, label_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "Label ID. Required for update and delete operations." }, label_list_visibility = { default = "labelShow", enum = ["labelShow", "labelHide"], type = "string", description = "Whether the label is shown in the label list." }, message_list_visibility = { default = "show", enum = ["show", "hide"], type = "string", description = "Whether the label is shown in the message list." } }, required = ["action"], type = "object" }

[[mcp_servers.tools]]
name = "list_gmail_filters"
description = '''Lists all Gmail filters configured in the user's mailbox.

Args:
Returns:
    str: A formatted list of filters with their criteria and actions.'''
args_schema = { additionalProperties = false, properties = {  }, type = "object" }

[[mcp_servers.tools]]
name = "manage_gmail_filter"
description = '''Manages Gmail filters. Supports creating and deleting filters.'''
args_schema = { additionalProperties = false, properties = { action = { type = "string", description = "Action to perform - \"create\" or \"delete\"." }, criteria = { anyOf = [{ additionalProperties = true, type = "object" }, { type = "null" }], description = "Filter criteria object (required for create)." }, filter_action = { anyOf = [{ additionalProperties = true, type = "object" }, { type = "null" }], description = "Filter action object (required for create). Named 'filter_action' to avoid shadowing the 'action' parameter." }, filter_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "ID of the filter to delete (required for delete)." } }, required = ["action"], type = "object" }

[[mcp_servers.tools]]
name = "modify_gmail_message_labels"
description = '''Adds or removes labels from a Gmail message.
To archive an email, remove the INBOX label.
To delete an email, add the TRASH label.'''
args_schema = { additionalProperties = false, properties = { message_id = { type = "string", description = "The ID of the message to modify." }, add_label_ids = { anyOf = [{ items = { type = "string" }, type = "array" }, { type = "null" }], items = { type = "string" }, type = "array", description = "List of label IDs to add to the message." }, remove_label_ids = { anyOf = [{ items = { type = "string" }, type = "array" }, { type = "null" }], items = { type = "string" }, type = "array", description = "List of label IDs to remove from the message." } }, required = ["message_id"], type = "object" }

[[mcp_servers.tools]]
name = "batch_modify_gmail_message_labels"
description = '''Adds or removes labels from multiple Gmail messages in a single batch request.'''
args_schema = { additionalProperties = false, properties = { message_ids = { items = { type = "string" }, type = "array", description = "A list of message IDs to modify." }, add_label_ids = { anyOf = [{ items = { type = "string" }, type = "array" }, { type = "null" }], items = { type = "string" }, type = "array", description = "List of label IDs to add to the messages." }, remove_label_ids = { anyOf = [{ items = { type = "string" }, type = "array" }, { type = "null" }], items = { type = "string" }, type = "array", description = "List of label IDs to remove from the messages." } }, required = ["message_ids"], type = "object" }

[[mcp_servers.tools]]
name = "search_drive_files"
description = '''Searches for files and folders within a user's Google Drive, including shared drives.'''
args_schema = { additionalProperties = false, properties = { query = { type = "string", description = "The search query string. Supports Google Drive search operators.\n         NOTE: Owner-based queries ('user@example.com' in owners) DO NOT WORK in Shared Drives\n         because files are owned by the shared drive itself, not individual users.\n         For recent files by a specific user in Shared Drives, search by modifiedTime\n         and use order_by='modifiedTime desc' instead." }, page_size = { default = 10, type = "integer", description = "The maximum number of files to return. Defaults to 10." }, page_token = { anyOf = [{ type = "string" }, { type = "null" }], description = "Page token from a previous response's nextPageToken to retrieve the next page of results." }, drive_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "ID of the shared drive to search. If None, behavior depends on `corpora` and `include_items_from_all_drives`." }, include_items_from_all_drives = { default = true, type = "boolean", description = "Whether shared drive items should be included in results. Defaults to True. This is effective when not specifying a `drive_id`." }, corpora = { anyOf = [{ type = "string" }, { type = "null" }], description = "Bodies of items to query (e.g., 'user', 'domain', 'drive', 'allDrives').\n                     If 'drive_id' is specified and 'corpora' is None, it defaults to 'drive'.\n                     Otherwise, Drive API default behavior applies. Prefer 'user' or 'drive' over 'allDrives' for efficiency." }, file_type = { anyOf = [{ type = "string" }, { type = "null" }], description = "Restrict results to a specific file type. Accepts a friendly\n                       name ('folder', 'document'/'doc', 'spreadsheet'/'sheet',\n                       'presentation'/'slides', 'form', 'drawing', 'pdf', 'shortcut',\n                       'script', 'site', 'jam'/'jamboard') or any raw MIME type\n                       string (e.g. 'application/pdf'). Defaults to None (all types)." }, detailed = { default = true, type = "boolean", description = "Whether to include size, modified time, and link in results. Defaults to True." }, order_by = { anyOf = [{ type = "string" }, { type = "null" }], description = "Sort order. Comma-separated list of sort keys with optional 'desc' modifier.\n                      Valid keys: 'createdTime', 'folder', 'modifiedByMeTime', 'modifiedTime',\n                      'name', 'name_natural', 'quotaBytesUsed', 'recency', 'sharedWithMeTime',\n                      'starred', 'viewedByMeTime'. Example: 'modifiedTime desc' or 'folder,modifiedTime desc,name'.\n                      Defaults to None (Drive API default ordering)." } }, required = ["query"], type = "object" }

[[mcp_servers.tools]]
name = "get_drive_file_content"
description = '''Retrieves the content of a specific Google Drive file by ID, supporting files in shared drives.

• Native Google Docs, Sheets, Slides → exported as text / CSV.
• Office files (.docx, .xlsx, .pptx) → unzipped & parsed with std-lib to
  extract readable text.
• PDFs → text extracted with pypdf when possible; scanned/image-only PDFs
  fall back to a download hint.
• Images → returned as base64 with MIME metadata for multimodal clients.
• Any other file → downloaded; tries UTF-8 decode, else notes binary.'''
args_schema = { additionalProperties = false, properties = { file_id = { type = "string", description = "Drive file ID." } }, required = ["file_id"], type = "object" }

[[mcp_servers.tools]]
name = "get_drive_file_download_url"
description = '''Downloads a Google Drive file and saves it to local disk.

In stdio mode, returns the local file path for direct access.
In HTTP mode, returns a temporary download URL (valid for 1 hour).

For Google native files (Docs, Sheets, Slides), exports to a useful format:
- Google Docs -> PDF (default) or DOCX if export_format='docx'
- Google Sheets -> XLSX (default), PDF if export_format='pdf', or CSV if export_format='csv'
- Google Slides -> PDF (default) or PPTX if export_format='pptx'

For other files, downloads the original file format.'''
args_schema = { additionalProperties = false, properties = { file_id = { type = "string", description = "The Google Drive file ID to download." }, export_format = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional export format for Google native files.\n          Options: 'pdf', 'docx', 'xlsx', 'csv', 'pptx'.\n          If not specified, uses sensible defaults (PDF for Docs/Slides, XLSX for Sheets).\n          For Sheets: supports 'csv', 'pdf', or 'xlsx' (default)." } }, required = ["file_id"], type = "object" }

[[mcp_servers.tools]]
name = "list_drive_items"
description = '''Lists files and folders, supporting shared drives.
If `drive_id` is specified, lists items within that shared drive. `folder_id` is then relative to that drive (or use drive_id as folder_id for root).
If `drive_id` is not specified, lists items from user's "My Drive" and accessible shared drives (if `include_items_from_all_drives` is True).'''
args_schema = { additionalProperties = false, properties = { folder_id = { default = "root", type = "string", description = "The ID of the Google Drive folder. Defaults to 'root'. For a shared drive, this can be the shared drive's ID to list its root, or a folder ID within that shared drive." }, page_size = { default = 100, type = "integer", description = "The maximum number of items to return. Defaults to 100." }, page_token = { anyOf = [{ type = "string" }, { type = "null" }], description = "Page token from a previous response's nextPageToken to retrieve the next page of results." }, drive_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "ID of the shared drive. If provided, the listing is scoped to this drive." }, include_items_from_all_drives = { default = true, type = "boolean", description = "Whether items from all accessible shared drives should be included if `drive_id` is not set. Defaults to True." }, corpora = { anyOf = [{ type = "string" }, { type = "null" }], description = "Corpus to query ('user', 'drive', 'allDrives'). If `drive_id` is set and `corpora` is None, 'drive' is used. If None and no `drive_id`, API defaults apply." }, file_type = { anyOf = [{ type = "string" }, { type = "null" }], description = "Restrict results to a specific file type. Accepts a friendly\n                       name ('folder', 'document'/'doc', 'spreadsheet'/'sheet',\n                       'presentation'/'slides', 'form', 'drawing', 'pdf', 'shortcut',\n                       'script', 'site', 'jam'/'jamboard') or any raw MIME type\n                       string (e.g. 'application/pdf'). Defaults to None (all types)." }, detailed = { default = true, type = "boolean", description = "Whether to include size, modified time, and link in results. Defaults to True." }, order_by = { anyOf = [{ type = "string" }, { type = "null" }], description = "Sort order. Comma-separated list of sort keys with optional 'desc' modifier.\n                      Valid keys: 'createdTime', 'folder', 'modifiedByMeTime', 'modifiedTime',\n                      'name', 'name_natural', 'quotaBytesUsed', 'recency', 'sharedWithMeTime',\n                      'starred', 'viewedByMeTime'. Example: 'modifiedTime desc' or 'folder,modifiedTime desc,name'.\n                      Defaults to None (Drive API default ordering)." } }, type = "object" }

[[mcp_servers.tools]]
name = "create_drive_folder"
description = '''Creates a new folder in Google Drive, supporting creation within shared drives.'''
args_schema = { additionalProperties = false, properties = { folder_name = { type = "string", description = "The name for the new folder." }, parent_folder_id = { default = "root", type = "string", description = "The ID of the parent folder. Defaults to 'root'.\nFor shared drives, use a folder ID within that shared drive." } }, required = ["folder_name"], type = "object" }

[[mcp_servers.tools]]
name = "create_drive_file"
description = '''Creates a new file in Google Drive, supporting creation within shared drives.
Accepts either direct content or a fileUrl to fetch the content from.'''
args_schema = { additionalProperties = false, properties = { file_name = { type = "string", description = "The name for the new file." }, content = { anyOf = [{ type = "string" }, { type = "null" }], description = "If provided, the content to write to the file." }, folder_id = { default = "root", type = "string", description = "The ID of the parent folder. Defaults to 'root'. For shared drives, this must be a folder ID within the shared drive." }, mime_type = { default = "text/plain", type = "string", description = "The MIME type of the file. Defaults to 'text/plain'." }, fileUrl = { anyOf = [{ type = "string" }, { type = "null" }], description = "If provided, fetches the file content from this URL. Supports file://, http://, and https:// protocols." } }, required = ["file_name"], type = "object" }

[[mcp_servers.tools]]
name = "import_to_google_doc"
description = '''Imports a file (Markdown, DOCX, TXT, HTML, RTF, ODT) into Google Docs format with automatic conversion.

Google Drive automatically converts the source file to native Google Docs format,
preserving formatting like headings, lists, bold, italic, etc.'''
args_schema = { additionalProperties = false, properties = { file_name = { type = "string", description = "The name for the new Google Doc (extension will be ignored)." }, content = { anyOf = [{ type = "string" }, { type = "null" }], description = "Text content for text-based formats (MD, TXT, HTML)." }, file_path = { anyOf = [{ type = "string" }, { type = "null" }], description = "Local file path for binary formats (DOCX, ODT). Supports file:// URLs." }, file_url = { anyOf = [{ type = "string" }, { type = "null" }], description = "Remote URL to fetch the file from (http/https)." }, source_format = { anyOf = [{ type = "string" }, { type = "null" }], description = "Source format hint ('md', 'markdown', 'docx', 'txt', 'html', 'rtf', 'odt').\n                           Auto-detected from file_name extension if not provided." }, folder_id = { default = "root", type = "string", description = "The ID of the parent folder. Defaults to 'root'." } }, required = ["file_name"], type = "object" }

[[mcp_servers.tools]]
name = "get_drive_file_permissions"
description = '''Gets detailed metadata about a Google Drive file including sharing permissions.'''
args_schema = { additionalProperties = false, properties = { file_id = { type = "string", description = "The ID of the file to check permissions for." } }, required = ["file_id"], type = "object" }

[[mcp_servers.tools]]
name = "check_drive_file_public_access"
description = '''Searches for a file by name and checks if it has public link sharing enabled.'''
args_schema = { additionalProperties = false, properties = { file_name = { type = "string", description = "The name of the file to check." } }, required = ["file_name"], type = "object" }

[[mcp_servers.tools]]
name = "update_drive_file"
description = '''Updates metadata and properties of a Google Drive file.'''
args_schema = { additionalProperties = false, properties = { file_id = { type = "string", description = "The ID of the file to update. Required." }, name = { anyOf = [{ type = "string" }, { type = "null" }], description = "New name for the file." }, description = { anyOf = [{ type = "string" }, { type = "null" }], description = "New description for the file." }, mime_type = { anyOf = [{ type = "string" }, { type = "null" }], description = "New MIME type (note: changing type may require content upload)." }, add_parents = { anyOf = [{ type = "string" }, { type = "null" }], description = "Comma-separated folder IDs to add as parents." }, remove_parents = { anyOf = [{ type = "string" }, { type = "null" }], description = "Comma-separated folder IDs to remove from parents." }, starred = { anyOf = [{ type = "boolean" }, { type = "null" }], description = "Whether to star/unstar the file." }, trashed = { anyOf = [{ type = "boolean" }, { type = "null" }], description = "Whether to move file to/from trash." }, writers_can_share = { anyOf = [{ type = "boolean" }, { type = "null" }], description = "Whether editors can share the file." }, copy_requires_writer_permission = { anyOf = [{ type = "boolean" }, { type = "null" }], description = "Whether copying requires writer permission." }, properties = { anyOf = [{ additionalProperties = true, type = "object" }, { type = "null" }], description = "Custom key-value properties for the file." } }, required = ["file_id"], type = "object" }

[[mcp_servers.tools]]
name = "get_drive_shareable_link"
description = '''Gets the shareable link for a Google Drive file or folder.'''
args_schema = { additionalProperties = false, properties = { file_id = { type = "string", description = "The ID of the file or folder to get the shareable link for. Required." } }, required = ["file_id"], type = "object" }

[[mcp_servers.tools]]
name = "manage_drive_access"
description = '''Consolidated tool for managing Google Drive file and folder access permissions.

Supports granting, batch-granting, updating, revoking permissions, and
transferring file ownership -- all through a single entry point.'''
