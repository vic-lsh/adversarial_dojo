[[mcp_servers.tools]]
name = "manage_presentation_comment"
description = '''Manage comments on a Google Presentation.

Actions:
  - create: Create a new comment. Requires comment_content.
    Note: The Drive API cannot anchor comments to arbitrary text;
    Slides comments are element-scoped via the API.
  - reply: Reply to a comment. Requires comment_id and comment_content.
  - resolve: Resolve a comment. Requires comment_id.'''
args_schema = { additionalProperties = false, properties = { presentation_id = { type = "string" }, action = { type = "string" }, comment_content = { anyOf = [{ type = "string" }, { type = "null" }] }, comment_id = { anyOf = [{ type = "string" }, { type = "null" }] } }, required = ["presentation_id", "action"], type = "object" }

[[mcp_servers.tools]]
name = "list_task_lists"
