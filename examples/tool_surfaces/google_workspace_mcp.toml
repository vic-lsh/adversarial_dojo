[[mcp_servers.tools]]
name = "inspect_doc_structure"
description = '''Essential tool for finding safe insertion points and understanding document structure.

USE THIS FOR:
- Finding the correct index for table insertion
- Understanding document layout before making changes
- Locating existing tables and their positions
- Getting document statistics and complexity info
- Inspecting structure of specific tabs

CRITICAL FOR TABLE OPERATIONS:
ALWAYS call this BEFORE creating tables to get a safe insertion index.

WHAT THE OUTPUT SHOWS:
- total_elements: Number of document elements
- total_length: Maximum safe index for insertion
- tables: Number of existing tables
- table_details: Position and dimensions of each table
- headers / footers: Real segment IDs and previews for header/footer editing
- tabs: List of available tabs in the document (if no tab_id specified)

WORKFLOW FOR TABLE INSERTION:
Step 1: Call this function
Step 2: Note the "total_length" value
Step 3: Use an index < total_length for table insertion
Step 4: Create your table

FORMATTING WORKFLOW:
After inserting all text via batch_update_doc with end_of_segment=true,
call this tool with detailed=true to get exact start_index and end_index
for every paragraph. Use those indices directly in format_text and
update_paragraph_style operations in a second batch_update_doc call.

HEADER/FOOTER WORKFLOW:
For ordinary header/footer text, use update_doc_headers_footers.
If you need low-level segment editing, call this tool first and use the
real segment_id values returned under headers/footers. Do not invent IDs.

The detailed output includes elements[].start_index and elements[].end_index
with text_preview for each paragraph, making it easy to identify which
ranges to format.'''
args_schema = { additionalProperties = false, properties = { document_id = { type = "string", description = "ID of the document to inspect" }, detailed = { default = false, type = "boolean", description = "Whether to return detailed structure information" }, tab_id = { type = "string", description = "Optional ID of the tab to inspect. If not provided, inspects main document." } }, required = ["document_id"], type = "object" }

[[mcp_servers.tools]]
name = "debug_docs_runtime_info"
description = '''Return runtime/source information for diagnosing stale MCP server instances.

This is a temporary diagnostic tool intended to verify which code checkout
the running MCP server has loaded.'''
args_schema = { additionalProperties = false, properties = {  }, type = "object" }

[[mcp_servers.tools]]
name = "create_table_with_data"
description = '''Creates a table and populates it with data in one reliable operation.

CRITICAL: YOU MUST CALL inspect_doc_structure FIRST TO GET THE INDEX!

MANDATORY WORKFLOW - DO THESE STEPS IN ORDER:

Step 1: ALWAYS call inspect_doc_structure first
Step 2: Use the 'total_length' value from inspect_doc_structure as your index
Step 3: Format data as 2D list: [["col1", "col2"], ["row1col1", "row1col2"]]
Step 4: Call this function with the correct index and data

EXAMPLE DATA FORMAT:
table_data = [
    ["Header1", "Header2", "Header3"],    # Row 0 - headers
    ["Data1", "Data2", "Data3"],          # Row 1 - first data row
    ["Data4", "Data5", "Data6"]           # Row 2 - second data row
]

CRITICAL INDEX REQUIREMENTS:
- NEVER use index values like 1, 2, 10 without calling inspect_doc_structure first
- ALWAYS get index from inspect_doc_structure 'total_length' field
- Index must be a valid insertion point in the document

DATA FORMAT REQUIREMENTS:
- Must be 2D list of strings only
- Each inner list = one table row
- All rows MUST have same number of columns
- Use empty strings "" for empty cells, never None
- Use debug_table_structure after creation to verify results'''
args_schema = { additionalProperties = false, properties = { document_id = { type = "string", description = "ID of the document to update" }, table_data = { items = { items = { type = "string" }, type = "array" }, type = "array", description = "2D list of strings - EXACT format: [[\"col1\", \"col2\"], [\"row1col1\", \"row1col2\"]]" }, index = { type = "integer", description = "Document position (MANDATORY: get from inspect_doc_structure 'total_length')" }, bold_headers = { default = true, type = "boolean", description = "Whether to make first row bold (default: true)" }, tab_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional tab ID to create the table in a specific tab" } }, required = ["document_id", "table_data", "index"], type = "object" }

[[mcp_servers.tools]]
name = "debug_table_structure"
description = '''ESSENTIAL DEBUGGING TOOL - Use this whenever tables don't work as expected.

USE THIS IMMEDIATELY WHEN:
- Table population put data in wrong cells
- You get "table not found" errors
- Data appears concatenated in first cell
- Need to understand existing table structure
- Planning to use populate_existing_table

WHAT THIS SHOWS YOU:
- Exact table dimensions (rows × columns)
- Each cell's position coordinates (row,col)
- Current content in each cell
- Insertion indices for each cell
- Table boundaries and ranges

HOW TO READ THE OUTPUT:
- "dimensions": "2x3" = 2 rows, 3 columns
- "position": "(0,0)" = first row, first column
- "current_content": What's actually in each cell right now
- "insertion_index": Where new text would be inserted in that cell

WORKFLOW INTEGRATION:
1. After creating table → Use this to verify structure
2. Before populating → Use this to plan your data format
3. After population fails → Use this to see what went wrong
4. When debugging → Compare your data array to actual table structure'''
args_schema = { additionalProperties = false, properties = { document_id = { type = "string", description = "ID of the document to inspect" }, table_index = { default = 0, type = "integer", description = "Which table to debug (0 = first table, 1 = second table, etc.)" } }, required = ["document_id"], type = "object" }

[[mcp_servers.tools]]
name = "export_doc_to_pdf"
description = '''Exports a Google Doc to PDF format and saves it to Google Drive.'''
args_schema = { additionalProperties = false, properties = { document_id = { type = "string", description = "ID of the Google Doc to export" }, pdf_filename = { type = "string", description = "Name for the PDF file (optional - if not provided, uses original name + \"_PDF\")" }, folder_id = { type = "string", description = "Drive folder ID to save PDF in (optional - if not provided, saves in root)" } }, required = ["document_id"], type = "object" }

[[mcp_servers.tools]]
name = "update_paragraph_style"
description = '''Apply paragraph-level formatting, heading styles, and/or list formatting to a range in a Google Doc.

This tool can apply named heading styles (H1-H6) for semantic document structure,
create bulleted or numbered lists with nested indentation, and customize paragraph
properties like alignment, spacing, and indentation. All operations can be applied
in a single call.'''
args_schema = { additionalProperties = false, properties = { document_id = { type = "string", description = "Document ID to modify" }, start_index = { type = "integer", description = "Start position using Docs API indices from\ninspect_doc_structure. For the main body, 0 is also accepted as an\nalias for the first writable position." }, end_index = { type = "integer", description = "End position (exclusive) - should cover the entire paragraph" }, heading_level = { type = "integer", description = "Heading level 0-6 (0 = NORMAL_TEXT, 1 = H1, 2 = H2, etc.)\n           Use for semantic document structure" }, alignment = { type = "string", description = "Text alignment - 'START' (left), 'CENTER', 'END' (right), or 'JUSTIFIED'" }, line_spacing = { type = "number", description = "Line spacing multiplier (1.0 = single, 1.5 = 1.5x, 2.0 = double)" }, indent_first_line = { type = "number", description = "First line indent in points (e.g., 36 for 0.5 inch)" }, indent_start = { type = "number", description = "Left/start indent in points" }, indent_end = { type = "number", description = "Right/end indent in points" }, space_above = { type = "number", description = "Space above paragraph in points (e.g., 12 for one line)" }, space_below = { type = "number", description = "Space below paragraph in points" }, named_style_type = { type = "string", description = "Direct named style type - 'NORMAL_TEXT', 'TITLE', 'SUBTITLE',\n             'HEADING_1' through 'HEADING_6'. Mutually exclusive with heading_level." }, tab_id = { type = "string", description = "Optional document tab ID to target" }, segment_id = { type = "string", description = "Optional header/footer/footnote segment ID to target" }, direction = { type = "string", description = "Paragraph direction - 'LEFT_TO_RIGHT' or 'RIGHT_TO_LEFT'" }, keep_lines_together = { type = "boolean", description = "Keep all lines of the paragraph together" }, keep_with_next = { type = "boolean", description = "Keep the paragraph with the next paragraph" }, avoid_widow_and_orphan = { type = "boolean", description = "Avoid widows/orphans for the paragraph" }, page_break_before = { type = "boolean", description = "Start the paragraph on a new page" }, spacing_mode = { type = "string", description = "'NEVER_COLLAPSE' or 'COLLAPSE_LISTS'" }, shading_color = { type = "string", description = "Paragraph shading/background color (#RRGGBB)" }, list_type = { type = "string", description = "Create a list from existing paragraphs ('UNORDERED' for bullets, 'ORDERED' for numbers, 'CHECKBOX' for checklists)" }, list_nesting_level = { type = "integer", description = "Nesting level for lists (0-8, where 0 is top level, default is 0)\n               Use higher levels for nested/indented list items" }, bullet_preset = { type = "string", description = "Optional explicit Google Docs bullet preset" } }, required = ["document_id", "start_index", "end_index"], type = "object" }

[[mcp_servers.tools]]
name = "get_doc_as_markdown"
description = '''Reads a Google Doc and returns it as clean Markdown with optional comment context.

Unlike get_doc_content which returns plain text, this tool preserves document
formatting as Markdown: headings, bold/italic/strikethrough, links, code spans,
ordered/unordered lists with nesting, and tables.

When comments are included (the default), each comment's anchor text — the specific
text the comment was attached to — is preserved, giving full context for the discussion.'''
args_schema = { additionalProperties = false, properties = { document_id = { type = "string", description = "ID of the Google Doc (or full URL)" }, include_comments = { default = true, type = "boolean", description = "Whether to include comments (default: True)" }, comment_mode = { default = "inline", type = "string", description = "How to display comments:\n- \"inline\": Footnote-style references placed at the anchor text location (default)\n- \"appendix\": All comments grouped at the bottom with blockquoted anchor text\n- \"none\": No comments included" }, include_resolved = { default = false, type = "boolean", description = "Whether to include resolved comments (default: False)" }, suggestions_view_mode = { default = "DEFAULT_FOR_CURRENT_ACCESS", type = "string", description = "How to render suggestions in the returned content:\n- \"DEFAULT_FOR_CURRENT_ACCESS\": Default based on user's access level\n- \"SUGGESTIONS_INLINE\": Suggested changes appear inline in the document\n- \"PREVIEW_SUGGESTIONS_ACCEPTED\": Preview as if all suggestions were accepted\n- \"PREVIEW_WITHOUT_SUGGESTIONS\": Preview as if all suggestions were rejected" } }, required = ["document_id"], type = "object" }

[[mcp_servers.tools]]
name = "manage_doc_tab"
description = '''Manage document tabs: create, rename, delete, or populate from Markdown.'''
args_schema = { additionalProperties = false, properties = { document_id = { type = "string", description = "ID of the document" }, action = { enum = ["create", "rename", "delete", "populate_from_markdown"], type = "string", description = "Action to perform - \"create\", \"rename\", \"delete\", or \"populate_from_markdown\"" }, tab_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "Tab ID (required for rename, delete, populate_from_markdown; use inspect_doc_structure to find IDs)" }, title = { anyOf = [{ type = "string" }, { type = "null" }], description = "Tab title (required for create; used by rename)" }, index = { anyOf = [{ type = "integer" }, { type = "null" }], description = "Position index for new tab, 0-based among siblings (required for create)" }, parent_tab_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional parent tab ID to nest under (create only)" }, markdown_text = { anyOf = [{ type = "string" }, { type = "null" }], description = "Markdown source to render (populate_from_markdown only)" }, replace_existing = { default = true, type = "boolean", description = "Clear tab body before inserting markdown (default True)" } }, required = ["document_id", "action"], type = "object" }

[[mcp_servers.tools]]
name = "list_document_comments"
description = '''List all comments from a Google Document.'''
args_schema = { additionalProperties = false, properties = { document_id = { type = "string" } }, required = ["document_id"], type = "object" }

[[mcp_servers.tools]]
name = "manage_document_comment"
description = '''Manage comments on a Google Document.

Actions:
  - create: Create a new document-level comment. Requires comment_content.
    Note: The Drive API cannot anchor comments to specific text; only
    the Google Docs UI can do that.
  - reply: Reply to a comment. Requires comment_id and comment_content.
  - resolve: Resolve a comment. Requires comment_id.'''
args_schema = { additionalProperties = false, properties = { document_id = { type = "string" }, action = { type = "string" }, comment_content = { anyOf = [{ type = "string" }, { type = "null" }] }, comment_id = { anyOf = [{ type = "string" }, { type = "null" }] } }, required = ["document_id", "action"], type = "object" }

[[mcp_servers.tools]]
name = "list_spreadsheets"
description = '''Lists spreadsheets from Google Drive that the user has access to.'''
args_schema = { additionalProperties = false, properties = { max_results = { default = 25, type = "integer", description = "Maximum number of spreadsheets to return. Defaults to 25." } }, type = "object" }

[[mcp_servers.tools]]
name = "get_spreadsheet_info"
description = '''Gets information about a specific spreadsheet including its sheets.'''
args_schema = { additionalProperties = false, properties = { spreadsheet_id = { type = "string", description = "The ID of the spreadsheet to get info for. Required." } }, required = ["spreadsheet_id"], type = "object" }

[[mcp_servers.tools]]
name = "read_sheet_values"
description = '''Reads values from a specific range in a Google Sheet.'''
args_schema = { additionalProperties = false, properties = { spreadsheet_id = { type = "string", description = "The ID of the spreadsheet. Required." }, range_name = { default = "A1:Z1000", type = "string", description = "The range to read (e.g., \"Sheet1!A1:D10\", \"A1:D10\"). Defaults to \"A1:Z1000\"." }, include_hyperlinks = { default = false, type = "boolean", description = "If True, also fetch hyperlink metadata for the range.\nDefaults to False to avoid expensive includeGridData requests." }, include_notes = { default = false, type = "boolean", description = "If True, also fetch cell notes for the range.\nDefaults to False to avoid expensive includeGridData requests." }, include_formulas = { default = false, type = "boolean", description = "If True, also fetch raw formula strings for cells that\ncontain formulas. Useful for identifying cross-sheet references before writing\nback to a range. Defaults to False to avoid an extra API request." } }, required = ["spreadsheet_id"], type = "object" }

[[mcp_servers.tools]]
name = "modify_sheet_values"
