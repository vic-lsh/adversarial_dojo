[[mcp_servers.tools]]
name = "append_table_rows"
description = '''Appends rows to a structured table in a Google Sheet. The rows are added
to the end of the table body, automatically extending the table range.

Use list_sheet_tables first to find the table ID.'''
args_schema = { additionalProperties = false, properties = { spreadsheet_id = { type = "string", description = "The ID of the spreadsheet. Required." }, table_id = { type = "string", description = "The ID of the table to append to (get from list_sheet_tables). Required." }, values = { anyOf = [{ type = "string" }, { items = { items = {  }, type = "array" }, type = "array" }], description = "2D array of values to append. Each inner\nlist is one row. Can be a JSON string or Python list. Required." } }, required = ["spreadsheet_id", "table_id", "values"], type = "object" }

[[mcp_servers.tools]]
name = "resize_sheet_dimensions"
description = '''Manages sheet-level dimension properties: resize columns/rows, auto-resize
to fit content, freeze rows/columns, hide/unhide rows/columns, and
insert/delete rows/columns.'''
args_schema = { additionalProperties = false, properties = { spreadsheet_id = { type = "string", description = "The ID of the spreadsheet. Required." }, sheet_name = { anyOf = [{ type = "string" }, { type = "null" }], description = "Sheet name to target. Defaults to the\nfirst sheet if not provided." }, column_sizes = { anyOf = [{ type = "string" }, { additionalProperties = true, type = "object" }, { type = "null" }], description = "Dict mapping column letters\nto pixel widths. Example: {\"A\": 200, \"C\": 300}. Can be a JSON\nstring or Python dict." }, row_sizes = { anyOf = [{ type = "string" }, { additionalProperties = true, type = "object" }, { type = "null" }], description = "Dict mapping 1-based row\nnumbers to pixel heights. Example: {\"1\": 40, \"3\": 60}. Can be\na JSON string or Python dict." }, auto_resize_columns = { anyOf = [{ type = "string" }, { items = { type = "string" }, type = "array" }, { type = "null" }], description = "List of column\nletters to auto-resize to fit content. Example: [\"A\", \"B\"]." }, auto_resize_rows = { anyOf = [{ type = "string" }, { items = { type = "integer" }, type = "array" }, { type = "null" }], description = "List of 1-based\nrow numbers to auto-resize to fit content. Example: [1, 2]." }, frozen_row_count = { anyOf = [{ type = "integer" }, { type = "null" }], description = "Number of rows to freeze from the\ntop. Use 0 to unfreeze all rows." }, frozen_column_count = { anyOf = [{ type = "integer" }, { type = "null" }], description = "Number of columns to freeze from\nthe left. Use 0 to unfreeze all columns." }, hide_columns = { anyOf = [{ type = "string" }, { items = { type = "string" }, type = "array" }, { type = "null" }], description = "List of column letters\nto hide. Example: [\"C\", \"D\"]." }, unhide_columns = { anyOf = [{ type = "string" }, { items = { type = "string" }, type = "array" }, { type = "null" }], description = "List of column\nletters to unhide. Example: [\"C\", \"D\"]." }, hide_rows = { anyOf = [{ type = "string" }, { items = { type = "integer" }, type = "array" }, { type = "null" }], description = "List of 1-based row\nnumbers to hide. Example: [3, 4]." }, unhide_rows = { anyOf = [{ type = "string" }, { items = { type = "integer" }, type = "array" }, { type = "null" }], description = "List of 1-based row\nnumbers to unhide. Example: [3, 4]." }, insert_rows = { anyOf = [{ type = "integer" }, { type = "null" }], description = "Number of rows to insert." }, insert_rows_at = { anyOf = [{ type = "integer" }, { type = "null" }], description = "1-based row number to insert before.\nAppends to the end of the sheet if omitted." }, insert_columns = { anyOf = [{ type = "integer" }, { type = "null" }], description = "Number of columns to insert." }, insert_columns_at = { anyOf = [{ type = "string" }, { type = "null" }], description = "Column letter to insert before\n(e.g. \"C\"). Appends to the end if omitted." }, delete_rows = { anyOf = [{ type = "string" }, { items = { type = "integer" }, type = "array" }, { type = "null" }], description = "List of 1-based row\nnumbers to delete. Example: [5, 6]. Best for non-contiguous rows." }, delete_row_range = { anyOf = [{ type = "string" }, { type = "null" }], description = "Contiguous range of rows to delete,\nas \"start:end\" (1-based, inclusive). Example: \"5:10\" deletes rows\n5 through 10. More efficient than delete_rows for large contiguous\nranges." }, delete_columns = { anyOf = [{ type = "string" }, { items = { type = "string" }, type = "array" }, { type = "null" }], description = "List of column\nletters to delete. Example: [\"E\", \"F\"]." } }, required = ["spreadsheet_id"], type = "object" }

[[mcp_servers.tools]]
name = "move_sheet_rows"
description = '''Moves rows from one sheet to another within the same spreadsheet. The move
is performed in a single batchUpdate (copyPaste followed by
deleteDimension). Note: batchUpdate executes requests sequentially but does
not roll back on partial failure — if the copy succeeds but the delete
fails, rows may be duplicated. Formulas, data types, and formatting are
preserved (unlike a values.get/append round-trip).
Row numbers are 1-based (matching the spreadsheet UI).'''
args_schema = { additionalProperties = false, properties = { spreadsheet_id = { type = "string", description = "The ID of the spreadsheet. Required." }, source_sheet = { type = "string", description = "Name of the sheet to move rows from. Required." }, start_row = { type = "integer", description = "First row to move (1-based, inclusive). Required." }, end_row = { type = "integer", description = "Last row to move (1-based, inclusive). Required." }, destination_sheet = { type = "string", description = "Name of the sheet to move rows to. Required." } }, required = ["spreadsheet_id", "source_sheet", "start_row", "end_row", "destination_sheet"], type = "object" }

[[mcp_servers.tools]]
name = "list_spreadsheet_comments"
description = '''List all comments from a Google Spreadsheet.'''
args_schema = { additionalProperties = false, properties = { spreadsheet_id = { type = "string" } }, required = ["spreadsheet_id"], type = "object" }

[[mcp_servers.tools]]
name = "manage_spreadsheet_comment"
description = '''Manage comments on a Google Spreadsheet.

Actions:
  - create: Create a new comment. Requires comment_content.
    Note: The Drive API cannot anchor comments to arbitrary text;
    Sheets comments are cell-scoped via the API.
  - reply: Reply to a comment. Requires comment_id and comment_content.
  - resolve: Resolve a comment. Requires comment_id.'''
args_schema = { additionalProperties = false, properties = { spreadsheet_id = { type = "string" }, action = { type = "string" }, comment_content = { anyOf = [{ type = "string" }, { type = "null" }] }, comment_id = { anyOf = [{ type = "string" }, { type = "null" }] } }, required = ["spreadsheet_id", "action"], type = "object" }

[[mcp_servers.tools]]
name = "list_spaces"
description = '''Lists Google Chat spaces (rooms and direct messages) accessible to the user.

Returns:
    str: A formatted list of Google Chat spaces accessible to the user.'''
args_schema = { additionalProperties = false, properties = { page_size = { default = 100, type = "integer" }, space_type = { default = "all", type = "string" } }, type = "object" }

[[mcp_servers.tools]]
name = "get_messages"
description = '''Retrieves messages from a Google Chat space.'''
args_schema = { additionalProperties = false, properties = { space_id = { type = "string" }, page_size = { default = 50, type = "integer" }, order_by = { default = "createTime desc", type = "string" }, message_filter = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional filter string using the Chat API filter syntax.\n            Supports createTime and thread.name.\n            Examples:\n              'createTime > \"2026-03-18T00:00:00-03:00\"'\n              'createTime > \"2026-03-18T00:00:00-03:00\" AND createTime < \"2026-03-19T00:00:00-03:00\"'\n              'thread.name = spaces/X/threads/Y'" } }, required = ["space_id"], type = "object" }

[[mcp_servers.tools]]
name = "send_message"
description = '''Sends a message to a Google Chat space.'''
args_schema = { additionalProperties = false, properties = { space_id = { type = "string" }, message_text = { type = "string" }, thread_key = { anyOf = [{ type = "string" }, { type = "null" }], description = "Reply in a thread by app-defined key (creates thread if not found)." }, thread_name = { anyOf = [{ type = "string" }, { type = "null" }], description = "Reply in an existing thread by its resource name (e.g. spaces/X/threads/Y)." } }, required = ["space_id", "message_text"], type = "object" }

[[mcp_servers.tools]]
name = "search_messages"
description = '''Searches for messages in Google Chat spaces by text content and/or time range.'''
args_schema = { additionalProperties = false, properties = { query = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional text to search for. If omitted, only time_filter is applied." }, space_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional space to restrict the search to." }, page_size = { default = 25, type = "integer", description = "Maximum number of messages to return per space." }, time_filter = { anyOf = [{ type = "string" }, { type = "null" }], description = "Optional filter using Chat API createTime syntax.\n         Examples:\n           'createTime > \"2026-03-18T00:00:00-03:00\"'\n           'createTime > \"2026-03-18T00:00:00-03:00\" AND createTime < \"2026-03-19T00:00:00-03:00\"'" }, max_spaces = { default = 10, type = "integer", description = "Maximum number of spaces to search when space_id is not provided (default 10)." } }, type = "object" }

[[mcp_servers.tools]]
name = "create_reaction"
description = '''Adds an emoji reaction to a Google Chat message.'''
args_schema = { additionalProperties = false, properties = { message_id = { type = "string", description = "The message resource name (e.g. spaces/X/messages/Y)." }, emoji_unicode = { type = "string", description = "The emoji character to react with (e.g. 👍)." } }, required = ["message_id", "emoji_unicode"], type = "object" }

[[mcp_servers.tools]]
name = "download_chat_attachment"
description = '''Downloads an attachment from a Google Chat message and saves it to local disk.

In stdio mode, returns the local file path for direct access.
In HTTP mode, returns a temporary download URL (valid for 1 hour).'''
args_schema = { additionalProperties = false, properties = { message_id = { type = "string", description = "The message resource name (e.g. spaces/X/messages/Y)." }, attachment_index = { default = 0, type = "integer", description = "Zero-based index of the attachment to download (default 0)." } }, required = ["message_id"], type = "object" }

[[mcp_servers.tools]]
name = "create_form"
description = '''Create a new form using the title given in the provided form message in the request.'''
args_schema = { additionalProperties = false, properties = { title = { type = "string", description = "The title of the form." }, description = { anyOf = [{ type = "string" }, { type = "null" }], description = "The description of the form." }, document_title = { anyOf = [{ type = "string" }, { type = "null" }], description = "The document title (shown in browser tab)." } }, required = ["title"], type = "object" }

[[mcp_servers.tools]]
name = "get_form"
description = '''Get a form.'''
args_schema = { additionalProperties = false, properties = { form_id = { type = "string", description = "The ID of the form to retrieve." } }, required = ["form_id"], type = "object" }

[[mcp_servers.tools]]
name = "set_publish_settings"
description = '''Updates the publish settings of a form.'''
args_schema = { additionalProperties = false, properties = { form_id = { type = "string", description = "The ID of the form to update publish settings for." }, publish_as_template = { default = false, type = "boolean", description = "Whether to publish as a template. Defaults to False." }, require_authentication = { default = false, type = "boolean", description = "Whether to require authentication to view/submit. Defaults to False." } }, required = ["form_id"], type = "object" }

[[mcp_servers.tools]]
name = "get_form_response"
description = '''Get one response from the form.'''
args_schema = { additionalProperties = false, properties = { form_id = { type = "string", description = "The ID of the form." }, response_id = { type = "string", description = "The ID of the response to retrieve." } }, required = ["form_id", "response_id"], type = "object" }

[[mcp_servers.tools]]
name = "list_form_responses"
description = '''List a form's responses.'''
args_schema = { additionalProperties = false, properties = { form_id = { type = "string", description = "The ID of the form." }, page_size = { default = 10, type = "integer", description = "Maximum number of responses to return. Defaults to 10." }, page_token = { anyOf = [{ type = "string" }, { type = "null" }], description = "Token for retrieving next page of results." } }, required = ["form_id"], type = "object" }

[[mcp_servers.tools]]
name = "batch_update_form"
description = '''Apply batch updates to a Google Form.

Supports adding, updating, and deleting form items, as well as updating
form metadata and settings. This is the primary method for modifying form
content after creation.'''
args_schema = { additionalProperties = false, properties = { form_id = { type = "string", description = "The ID of the form to update." }, requests = { items = { additionalProperties = true, type = "object" }, type = "array", description = "List of update requests to apply.\nSupported request types:\n- createItem: Add a new question or content item\n- updateItem: Modify an existing item\n- deleteItem: Remove an item\n- moveItem: Reorder an item\n- updateFormInfo: Update form title/description\n- updateSettings: Modify form settings (e.g., quiz mode)" } }, required = ["form_id", "requests"], type = "object" }

[[mcp_servers.tools]]
name = "create_presentation"
