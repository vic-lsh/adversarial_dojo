Colors accept hex strings (#RRGGBB). Number formats follow Sheets types
(e.g., NUMBER, CURRENCY, DATE, PERCENT). If no sheet name is provided,
the first sheet is used.'''
args_schema = { additionalProperties = false, properties = { spreadsheet_id = { type = "string", description = "The ID of the spreadsheet. Required." }, range_name = { type = "string", description = "A1-style range (optionally with sheet name). Required." }, background_color = { anyOf = [{ type = "string" }, { type = "null" }], description = "Hex background color (e.g., \"#FFEECC\")." }, text_color = { anyOf = [{ type = "string" }, { type = "null" }], description = "Hex text color (e.g., \"#000000\")." }, number_format_type = { anyOf = [{ type = "string" }, { type = "null" }], description = "Sheets number format type (e.g., \"DATE\")." }, number_format_pattern = { anyOf = [{ type = "string" }, { type = "null" }], description = "Custom pattern for the number format." }, wrap_strategy = { anyOf = [{ type = "string" }, { type = "null" }], description = "Text wrap strategy - WRAP (wrap text within\ncell), CLIP (clip text at cell boundary), or OVERFLOW_CELL (allow text\nto overflow into adjacent empty cells)." }, horizontal_alignment = { anyOf = [{ type = "string" }, { type = "null" }], description = "Horizontal text alignment - LEFT,\nCENTER, or RIGHT." }, vertical_alignment = { anyOf = [{ type = "string" }, { type = "null" }], description = "Vertical text alignment - TOP, MIDDLE,\nor BOTTOM." }, bold = { anyOf = [{ type = "boolean" }, { type = "null" }], description = "Whether to apply bold formatting." }, italic = { anyOf = [{ type = "boolean" }, { type = "null" }], description = "Whether to apply italic formatting." }, font_size = { anyOf = [{ type = "integer" }, { type = "null" }], description = "Font size in points." } }, required = ["spreadsheet_id", "range_name"], type = "object" }

[[mcp_servers.tools]]
name = "manage_conditional_formatting"
description = '''Manages conditional formatting rules on a Google Sheet. Supports adding,
updating, and deleting conditional formatting rules via a single tool.'''
args_schema = { additionalProperties = false, properties = { spreadsheet_id = { type = "string", description = "The ID of the spreadsheet. Required." }, action = { type = "string", description = "The operation to perform. Must be one of \"add\", \"update\",\nor \"delete\"." }, range_name = { anyOf = [{ type = "string" }, { type = "null" }], description = "A1-style range (optionally with sheet name).\nRequired for \"add\". Optional for \"update\" (preserves existing ranges\nif omitted). Not used for \"delete\"." }, condition_type = { anyOf = [{ type = "string" }, { type = "null" }], description = "Sheets condition type (e.g., NUMBER_GREATER,\nTEXT_CONTAINS, DATE_BEFORE, CUSTOM_FORMULA). Required for \"add\".\nOptional for \"update\" (preserves existing type if omitted)." }, condition_values = { anyOf = [{ type = "string" }, { items = { anyOf = [{ type = "string" }, { type = "integer" }, { type = "number" }] }, type = "array" }, { type = "null" }], description = "Values\nfor the condition; accepts a list or a JSON string representing a list.\nDepends on condition_type. Used by \"add\" and \"update\"." }, background_color = { anyOf = [{ type = "string" }, { type = "null" }], description = "Hex background color to apply when\ncondition matches. Used by \"add\" and \"update\"." }, text_color = { anyOf = [{ type = "string" }, { type = "null" }], description = "Hex text color to apply when condition matches.\nUsed by \"add\" and \"update\"." }, rule_index = { anyOf = [{ type = "integer" }, { type = "null" }], description = "0-based index of the rule. For \"add\", optionally\nspecifies insertion position. Required for \"update\" and \"delete\"." }, gradient_points = { anyOf = [{ type = "string" }, { items = { additionalProperties = true, type = "object" }, type = "array" }, { type = "null" }], description = "List (or JSON list) of\ngradient points for a color scale. If provided, a gradient rule is created\nand boolean parameters are ignored. Used by \"add\" and \"update\"." }, sheet_name = { anyOf = [{ type = "string" }, { type = "null" }], description = "Sheet name to locate the rule when range_name is\nomitted. Defaults to the first sheet. Used by \"update\" and \"delete\"." } }, required = ["spreadsheet_id", "action"], type = "object" }

[[mcp_servers.tools]]
