ean", description = "Remove hyperlink from the target range" }, baseline_offset = { type = "string", description = "One of NONE, SUPERSCRIPT, SUBSCRIPT" }, small_caps = { type = "boolean", description = "Whether to apply small caps" } }, required = ["document_id", "start_index"], type = "object" }

