args_schema = { additionalProperties = false, properties = { spreadsheet_id = { type = "string", description = "The ID of the spreadsheet. Required." }, range_name = { type = "string", description = "The range to modify (e.g., \"Sheet1!A1:D10\", \"A1:D10\"). Required." }, values = { anyOf = [{ type = "string" }, { items = { items = { type = "string" }, type = "array" }, type = "array" }, { type = "null" }], description = "2D array of values to write/update. Can be a JSON string or Python list. Required unless clear_values=True." }, value_input_option = { default = "USER_ENTERED", type = "string", description = "How to interpret input values (\"RAW\" or \"USER_ENTERED\"). Defaults to \"USER_ENTERED\"." }, clear_values = { default = false, type = "boolean", description = "If True, clears the range instead of writing values. Defaults to False." } }, required = ["spreadsheet_id", "range_name"], type = "object" }

[[mcp_servers.tools]]
name = "format_sheet_range"
description = '''Applies formatting to a range: colors, number formats, text wrapping,
