[[mcp_servers.tools]]
name = "manage_task"
description = '''Manage tasks: create, update, delete, or move tasks within task lists.'''
args_schema = { additionalProperties = false, properties = { action = { type = "string", description = "The action to perform. Must be one of: \"create\", \"update\", \"delete\", \"move\"." }, task_list_id = { type = "string", description = "The ID of the task list. Required for all actions." }, task_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "The ID of the task. Required for \"update\", \"delete\", and \"move\" actions." }, title = { anyOf = [{ type = "string" }, { type = "null" }], description = "The title of the task. Required for \"create\", optional for \"update\"." }, notes = { anyOf = [{ type = "string" }, { type = "null" }], description = "Notes/description for the task. Used by \"create\" and \"update\" actions." }, status = { anyOf = [{ type = "string" }, { type = "null" }], description = "Task status (\"needsAction\" or \"completed\"). Used by \"update\" action." }, due = { anyOf = [{ type = "string" }, { type = "null" }], description = "Due date in RFC 3339 format (e.g., \"2024-12-31T23:59:59Z\"). Used by \"create\" and \"update\" actions." }, parent = { anyOf = [{ type = "string" }, { type = "null" }], description = "Parent task ID (for subtasks). Used by \"create\" and \"move\" actions." }, previous = { anyOf = [{ type = "string" }, { type = "null" }], description = "Previous sibling task ID (for positioning). Used by \"create\" and \"move\" actions." }, destination_task_list = { anyOf = [{ type = "string" }, { type = "null" }], description = "Destination task list ID (for moving between lists). Used by \"move\" action." } }, required = ["action", "task_list_id"], type = "object" }

[[mcp_servers.tools]]
name = "search_custom"
description = '''Performs a search using Google Custom Search JSON API.'''
args_schema = { additionalProperties = false, properties = { q = { type = "string", description = "The search query. Required." }, num = { default = 10, type = "integer", description = "Number of results to return (1-10). Defaults to 10." }, start = { default = 1, type = "integer", description = "The index of the first result to return (1-based). Defaults to 1." }, safe = { default = "off", enum = ["active", "moderate", "off"], type = "string", description = "Safe search level. Defaults to \"off\"." }, search_type = { anyOf = [{ const = "image", type = "string" }, { type = "null" }], description = "Search for images if set to \"image\"." }, site_search = { anyOf = [{ type = "string" }, { type = "null" }], description = "Restrict search to a specific site/domain." }, site_search_filter = { anyOf = [{ enum = ["e", "i"], type = "string" }, { type = "null" }], description = "Exclude (\"e\") or include (\"i\") site_search results." }, date_restrict = { anyOf = [{ type = "string" }, { type = "null" }], description = "Restrict results by date (e.g., \"d5\" for past 5 days, \"m3\" for past 3 months)." }, file_type = { anyOf = [{ type = "string" }, { type = "null" }], description = "Filter by file type (e.g., \"pdf\", \"doc\")." }, language = { anyOf = [{ type = "string" }, { type = "null" }], description = "Language code for results (e.g., \"lang_en\")." }, country = { anyOf = [{ type = "string" }, { type = "null" }], description = "Country code for results (e.g., \"countryUS\")." }, sites = { anyOf = [{ items = { type = "string" }, type = "array" }, { type = "null" }], description = "List of sites/domains to restrict search to (e.g., [\"example.com\", \"docs.example.com\"]). When provided, results are limited to these sites." } }, required = ["q"], type = "object" }

