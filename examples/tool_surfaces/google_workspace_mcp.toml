[[mcp_servers.tools]]
name = "manage_task_list"
description = '''Manage task lists: create, update, delete, or clear completed tasks.'''
args_schema = { additionalProperties = false, properties = { action = { type = "string", description = "The action to perform. Must be one of: \"create\", \"update\", \"delete\", \"clear_completed\"." }, task_list_id = { anyOf = [{ type = "string" }, { type = "null" }], description = "The ID of the task list. Required for \"update\", \"delete\", and \"clear_completed\" actions." }, title = { anyOf = [{ type = "string" }, { type = "null" }], description = "The title for the task list. Required for \"create\" and \"update\" actions." } }, required = ["action"], type = "object" }

[[mcp_servers.tools]]
name = "list_tasks"
description = '''List all tasks in a specific task list.'''
args_schema = { additionalProperties = false, properties = { task_list_id = { type = "string", description = "The ID of the task list to retrieve tasks from." }, max_results = { default = 20, type = "integer", description = "Maximum number of tasks to return. (default: 20, max: 10000)." }, page_token = { anyOf = [{ type = "string" }, { type = "null" }], description = "Token for pagination." }, show_completed = { default = true, type = "boolean", description = "Whether to include completed tasks (default: True). Note that show_hidden must also be true to show tasks completed in first party clients, such as the web UI and Google's mobile apps." }, show_deleted = { default = false, type = "boolean", description = "Whether to include deleted tasks (default: False)." }, show_hidden = { default = false, type = "boolean", description = "Whether to include hidden tasks (default: False)." }, show_assigned = { default = false, type = "boolean", description = "Whether to include assigned tasks (default: False)." }, completed_max = { anyOf = [{ type = "string" }, { type = "null" }], description = "Upper bound for completion date (RFC 3339 timestamp)." }, completed_min = { anyOf = [{ type = "string" }, { type = "null" }], description = "Lower bound for completion date (RFC 3339 timestamp)." }, due_max = { anyOf = [{ type = "string" }, { type = "null" }], description = "Upper bound for due date (RFC 3339 timestamp)." }, due_min = { anyOf = [{ type = "string" }, { type = "null" }], description = "Lower bound for due date (RFC 3339 timestamp)." }, updated_min = { anyOf = [{ type = "string" }, { type = "null" }], description = "Lower bound for last modification time (RFC 3339 timestamp)." } }, required = ["task_list_id"], type = "object" }

[[mcp_servers.tools]]
name = "get_task"
